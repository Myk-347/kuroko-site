<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d5940"><meta name="robots" content="noindex"><link rel="icon" href="/kuroko-mark.svg" type="image/svg+xml"><title>Kuroko Link</title>
<style>
:root{--bg1:#0d5940;--bg2:#05261f;--card:#ffffff14;--line:#ffffff1f;--text:#f4fffa;--muted:#ffffffa6;--mint:#52e3c1;--me:#ffffff;--purple:#c99bff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Noto Sans JP","Noto Sans SC","Noto Sans KR",sans-serif;display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header img{width:34px;height:34px}header b{font-size:20px;font-weight:800}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:#999}.dot.wait{background:#ffb340}.dot.ok{background:#34c759}
.bar{display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.bar label{font-size:13px;color:var(--muted)}
select{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
select option{color:#000}
.icon{margin-left:auto;font-size:22px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;width:46px;height:42px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
.hint{color:var(--muted);text-align:center;margin:28px 8px}
.msg{max-width:88%;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.msg.mine{align-self:flex-end;background:#52e3c124}
.msg small{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:2px}
.msg .orig{font-size:15px;color:var(--muted)}
.msg .tr{font-size:22px;font-weight:700;color:var(--me);margin-top:2px}
.msg.mine .tr{font-size:16px;color:var(--purple);font-weight:600}
.msg.mine .orig{font-size:20px;color:var(--text);font-weight:700}
.msg button{background:none;border:0;color:var(--mint);font:inherit;font-size:13px;font-weight:700;padding:4px 0 0;cursor:pointer}
footer{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.live{min-height:22px;color:var(--mint);font-size:15px}
#mic{width:100%;height:64px;border-radius:20px;border:0;font:inherit;font-size:19px;font-weight:800;color:#05261f;background:var(--mint);cursor:pointer}
#mic.on{background:#ffb340}#mic:disabled{opacity:.45}
.type{display:flex;gap:8px}.type input{flex:1;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.type button{font:inherit;font-weight:700;border-radius:12px;border:0;padding:0 16px;background:var(--card);color:var(--text)}
.ended{text-align:center;padding:30px 20px}.ended a{color:var(--mint);font-weight:700}
</style></head>
<body>
<header><img src="/kuroko-mark.svg" alt=""><b>Kuroko</b><div class="status"><span class="dot" id="dot"></span><span id="state"></span></div></header>
<div class="bar"><label for="lang" id="langLabel"></label><select id="lang"></select><button class="icon" id="sound" aria-label="Sound">🔊</button></div>
<main id="log"><p class="hint" id="hint"></p></main>
<footer id="foot"><div class="live" id="live"></div><button id="mic" disabled></button><form class="type" id="typeForm"><input id="typed" autocomplete="off"><button id="sendBtn"></button></form></footer>
<script src="/link.js"></script>
</body></html>
